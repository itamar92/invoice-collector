# Every push to main (a merged PR): run the checks, then ship that commit to the Oracle Cloud VM with
# deploy/deploy-oci.sh. Also runnable by hand from the Actions tab.
#
# Repository secrets (Settings -> Secrets and variables -> Actions), see docs/SETUP.md "Automatic deploys":
#   DEPLOY_HOST         user@vm-ip, e.g. ubuntu@203.0.113.10
#   DEPLOY_SSH_KEY      private half of a key used only for deploys (its public half in the VM's authorized_keys)
#   DEPLOY_KNOWN_HOSTS  the VM's host key line(s), from `ssh-keyscan <vm-ip>` run on a machine you trust
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cutting it off mid-build.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy secrets are set
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/SETUP.md)"; exit 1; fi

      # The host key is pinned from the secret (never learned on the fly), so a swapped server is refused.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      # Ships exactly this commit's tracked files; .env and the data volume on the VM are kept.
      - name: Deploy to the VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ./deploy/deploy-oci.sh "$DEPLOY_HOST"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
